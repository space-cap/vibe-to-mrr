<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프리랜서 실수령액 계산기 | 바이브코딩 첫 프로젝트</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body {
      background: radial-gradient(circle at 50% 10%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 36px 30px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; color: #ffffff; letter-spacing: -0.5px; }
    p.subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #cbd5e1; }
    .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 16px 45px 16px 16px;
      border-radius: 14px;
      border: 2px solid #334155;
      background: #090d16;
      color: #38bdf8;
      font-size: 22px;
      font-weight: 800;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2);
    }
    .currency-unit {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 16px;
      font-weight: 700;
    }
    .result-box {
      background: #090d16;
      border-radius: 18px;
      padding: 22px;
      margin-top: 8px;
      border: 1px solid #1e293b;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      color: #94a3b8;
    }
    .row span:last-child {
      font-weight: 600;
      color: #f1f5f9;
    }
    .row.total {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #1e293b;
      font-size: 16px;
      font-weight: 700;
    }
    .text-green { color: #4ade80 !important; font-size: 24px; font-weight: 900 !important; letter-spacing: -0.5px; }
    .text-red { color: #f87171 !important; }
    .quick-chips {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .chip {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover {
      background: #334155;
      color: #f8fafc;
    }
    .footer-action {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .share-btn {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      transition: all 0.2s;
    }
    .share-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .coffee-link {
      font-size: 13px;
      color: #64748b;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .coffee-link:hover { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <div style="text-align: center;">
      <span class="badge">🚀 바이브코딩 디지털 상품 1호 프로토타입</span>
      <h1>프리랜서 실수령액 계산기</h1>
      <p class="subtitle">계약 금액을 입력하면 3.3% 사업소득세 공제 후<br>통장에 꽂히는 실제 금액을 1초 만에 확인합니다.</p>
    </div>

    <label for="amount">계약 금액</label>
    <div class="input-wrapper">
      <input type="number" id="amount" value="1000000" step="10000">
      <span class="currency-unit">원</span>
    </div>

    <div class="quick-chips">
      <button class="chip" onclick="setAmount(500000)">50만</button>
      <button class="chip" onclick="setAmount(1000000)">100만</button>
      <button class="chip" onclick="setAmount(2000000)">200만</button>
      <button class="chip" onclick="setAmount(3000000)">300만</button>
      <button class="chip" onclick="setAmount(5000000)">500만</button>
    </div>

    <div class="result-box">
      <div class="row">
        <span>세전 계약 총액</span>
        <span id="grossDisplay">1,000,000원</span>
      </div>
      <div class="row">
        <span>소득세 (3.0%)</span>
        <span class="text-red" id="incomeTaxDisplay">-30,000원</span>
      </div>
      <div class="row">
        <span>지방소득세 (0.3%)</span>
        <span class="text-red" id="localTaxDisplay">-3,000원</span>
      </div>
      <div class="row total">
        <span style="color:#f8fafc;">통장 입금 실수령액</span>
        <span class="text-green" id="netDisplay">967,000원</span>
      </div>
    </div>

    <div class="footer-action">
      <button class="share-btn" onclick="copyResult()">📋 계산 결과 복사하기</button>
      <a href="https://toss.me" target="_blank" class="coffee-link">☕ 개발자에게 커피 한 잔 선물하기</a>
    </div>
  </div>

  <script>
    const input = document.getElementById('amount');
    const grossDisplay = document.getElementById('grossDisplay');
    const incomeTaxDisplay = document.getElementById('incomeTaxDisplay');
    const localTaxDisplay = document.getElementById('localTaxDisplay');
    const netDisplay = document.getElementById('netDisplay');

    function calculate() {
      const val = parseInt(input.value) || 0;
      const incomeTax = Math.floor(val * 0.03);
      const localTax = Math.floor(val * 0.003);
      const totalTax = incomeTax + localTax;
      const net = val - totalTax;

      grossDisplay.textContent = val.toLocaleString() + '원';
      incomeTaxDisplay.textContent = '-' + incomeTax.toLocaleString() + '원';
      localTaxDisplay.textContent = '-' + localTax.toLocaleString() + '원';
      netDisplay.textContent = net.toLocaleString() + '원';
    }

    function setAmount(num) {
      input.value = num;
      calculate();
    }

    input.addEventListener('input', calculate);

    function copyResult() {
      const text = `[💸 프리랜서 실수령액 계산 결과]\n• 계약 총액: ${grossDisplay.textContent}\n• 소득세(3.0%): ${incomeTaxDisplay.textContent}\n• 지방소득세(0.3%): ${localTaxDisplay.textContent}\n• 최종 실수령액: ${netDisplay.textContent}\n(바이브코딩으로 15분 만에 만든 계산기)`;
      navigator.clipboard.writeText(text).then(() => {
        alert('계산 결과가 클립보드에 복사되었습니다! 카카오톡이나 메모장에 붙여넣어 보세요.');
      });
    }

    calculate();
  </script>
</body>
</html>
