<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔮 AI 행운의 포춘 상담소 | 바이브코딩 프로토타입</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body {
      background: radial-gradient(circle at 50% 15%, #2e1065 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card-box {
      background: rgba(30, 27, 75, 0.75);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 36px 26px;
      width: 100%;
      max-width: 440px;
      border: 1px solid rgba(192, 132, 252, 0.25);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .sparkle { font-size: 34px; margin-bottom: 8px; display: inline-block; animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    .badge {
      display: inline-block;
      background: rgba(168, 85, 247, 0.2);
      color: #d8b4fe;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
      border: 1px solid rgba(168, 85, 247, 0.35);
    }
    h1 { font-size: 24px; font-weight: 800; color: #f3e8ff; margin-bottom: 6px; letter-spacing: -0.5px; }
    p.desc { font-size: 14px; color: #c084fc; margin-bottom: 24px; line-height: 1.5; }
    .input-group { margin-bottom: 16px; text-align: left; }
    label { font-size: 13px; font-weight: 600; color: #e9d5ff; margin-bottom: 6px; display: block; }
    input, select {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      background: #090d16;
      border: 1.5px solid #4c1d95;
      color: #f8fafc;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus {
      border-color: #a855f7;
      box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.25);
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.45);
      transition: all 0.2s;
      margin-top: 6px;
    }
    .btn-submit:hover { opacity: 0.95; transform: translateY(-1px); }
    .result-container {
      margin-top: 24px;
      padding: 22px;
      background: #090d16;
      border-radius: 20px;
      border: 1.5px solid #6b21a8;
      display: none;
      animation: fadeIn 0.4s ease-out;
      text-align: left;
    }
    .card-badge {
      display: inline-block;
      background: rgba(168, 85, 247, 0.3);
      color: #e9d5ff;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 12px;
      border: 1px solid rgba(168, 85, 247, 0.5);
    }
    .result-title { font-size: 18px; font-weight: 800; color: #facc15; margin-bottom: 10px; line-height: 1.4; }
    .result-text { font-size: 14px; color: #cbd5e1; line-height: 1.6; margin-bottom: 16px; white-space: pre-line; }
    .lucky-box {
      background: #1e1b4b;
      border-radius: 14px;
      padding: 14px;
      font-size: 13px;
      color: #c084fc;
      display: flex;
      justify-content: space-around;
      border: 1px solid rgba(168, 85, 247, 0.2);
    }
    .copy-btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: #3b0764;
      color: #e9d5ff;
      border: 1px solid #7e22ce;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover { background: #581c87; color: #ffffff; }
    .footer-action {
      margin-top: 26px;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .footer-action a {
      color: #c084fc;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }
    .footer-action a:hover { color: #f3e8ff; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card-box">
    <div class="sparkle">🔮</div>
    <span class="badge">바이브코딩 디지털 상품 2호</span>
    <h1>오늘의 AI 행운 포춘</h1>
    <p class="desc">마음속 고민을 적고 버튼을 누르면<br>신비로운 타로 카드와 맞춤 조언을 선물합니다.</p>

    <div class="input-group">
      <label for="category">고민 카테고리</label>
      <select id="category">
        <option value="love">💕 연애 & 인간관계</option>
        <option value="study">📚 학업 & 취업 / 시험</option>
        <option value="money">💰 재물 & 부업 성공</option>
        <option value="daily">🍀 오늘의 종합 컨디션</option>
      </select>
    </div>

    <div class="input-group">
      <label for="wish">오늘의 한 줄 고민 / 소원</label>
      <input type="text" id="wish" placeholder="예: 오늘 바이브코딩 첫 프로젝트 성공할까요?">
    </div>

    <button class="btn-submit" onclick="revealFortune()">✨ 신비로운 운세 열어보기</button>

    <div class="result-container" id="resultBox">
      <span class="card-badge" id="cardName">🌟 The Star (별 카드)</span>
      <h3 class="result-title" id="cardTitle">"가장 어두운 밤에 가장 밝은 별이 뜹니다"</h3>
      <p class="result-text" id="cardAdvice">지금 겪고 있는 고민은 더 큰 도약을 위한 밑거름입니다. 당신의 직관을 믿고 앞으로 나아가세요!</p>
      <div class="lucky-box">
        <span>🎨 행운의 색: <b id="luckyColor" style="color:#ffffff;">라벤더</b></span>
        <span>☕ 행운의 장소: <b id="luckyPlace" style="color:#ffffff;">탁 트인 카페</b></span>
      </div>
      <button class="copy-btn" onclick="shareResult()">📋 결과 복사해서 카톡으로 공유하기</button>
    </div>

    <div class="footer-action">
      <a href="https://toss.me" target="_blank">☕ 복채 선물하기</a>
      <span>•</span>
      <a href="https://open.kakao.com" target="_blank">🤝 이런 웹앱 제작 외주 문의</a>
    </div>
  </div>

  <script>
    const fortunes = [
      { name: "🌟 The Star (별)", title: "노력의 결실이 눈부시게 빛납니다", advice: "불안해하지 마세요. 당신이 쏟은 시간과 정성은 결코 배신하지 않습니다. 오늘의 선택은 대성공입니다!", color: "라벤더", place: "탁 트인 옥상/카페" },
      { name: "☀️ The Sun (태양)", title: "모든 막힘이 뻥 뚫리는 최고의 날", advice: "주변 사람들이 당신을 돕기 위해 손을 내밉니다. 미소를 잃지 말고 적극적으로 의사를 표현하세요!", color: "골드 옐로우", place: "햇살 드는 창가" },
      { name: "🏆 The Chariot (전차)", title: "망설이지 말고 돌진하세요", advice: "완벽한 준비를 기다리지 마세요. 지금 바로 시작하는 작은 한 걸음이 당신을 승리로 이끕니다.", color: "딥 블루", place: "도서관/작업실" },
      { name: "🌱 The Empress (여황제)", title: "풍요와 힐링이 가득한 하루", advice: "오늘은 나 자신에게 맛있는 음식과 휴식을 선물하세요. 쉼을 통해 엄청난 아이디어가 샘솟습니다.", color: "에메랄드 그린", place: "분위기 좋은 베이커리" },
      { name: "🔮 The Magician (마법사)", title: "당신 안에 모든 답과 도구가 있습니다", advice: "자신을 의심하지 마세요. 당신의 아이디어와 AI라는 마법의 도구가 결합하면 기적이 일어납니다!", color: "바이올렛", place: "조용한 서점" }
    ];

    function revealFortune() {
      const wish = document.getElementById('wish').value.trim();
      const res = fortunes[Math.floor(Math.random() * fortunes.length)];
      
      document.getElementById('cardName').textContent = res.name;
      document.getElementById('cardTitle').textContent = `"${res.title}"`;
      document.getElementById('cardAdvice').textContent = (wish ? `[고민: ${wish}]\n` : "") + res.advice;
      document.getElementById('luckyColor').textContent = res.color;
      document.getElementById('luckyPlace').textContent = res.place;

      document.getElementById('resultBox').style.display = 'block';
    }

    function shareResult() {
      const title = document.getElementById('cardTitle').textContent;
      const advice = document.getElementById('cardAdvice').textContent;
      const text = `[🔮 오늘의 AI 행운 포춘]\n${title}\n${advice}\n\n(바이브코딩으로 15분 만에 만든 인터랙티브 운세 웹앱)`;
      navigator.clipboard.writeText(text).then(() => {
        alert('운세 결과가 클립보드에 복사되었습니다! 카카오톡이나 인스타그램에 붙여넣어 보세요.');
      });
    }
  </script>
</body>
</html>
